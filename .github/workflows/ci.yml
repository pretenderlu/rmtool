name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r requirements.txt -r requirements-dev.txt
          python -m pip check
      - name: Lint
        run: python -m ruff check .
      - name: Run unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests
      - name: Validate device and firmware matrix
        run: python tools/validate_build_matrix.py
      - name: Run each test module in isolation
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/check_test_isolation.py
      - name: Check release inputs for the current version
        run: python tools/check_release.py
