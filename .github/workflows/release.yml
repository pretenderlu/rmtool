name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: x64
      - name: Build packages
        run: .\build-portable.ps1
      - name: Run unit tests
        run: .\build\.venv\Scripts\python.exe -m unittest discover -s tests -v
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: rmtool-windows-x64
          path: |
            dist/rmtool-windows-x64.zip
            dist/rmtool-windows-x64-onefile.exe
          if-no-files-found: error

  build-macos:
    name: Build macOS ARM64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: arm64
      - name: Install dependencies
        run: |
          python -m venv --clear build/.venv
          build/.venv/bin/python -m pip --isolated install --disable-pip-version-check --no-input --requirement requirements.txt "PyInstaller==6.21.0"
          build/.venv/bin/python -m pip check
      - name: Run unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: build/.venv/bin/python -m unittest discover -s tests -v
      - name: Generate app icon
        run: |
          iconset=build/rmtool.iconset
          mkdir -p "$iconset"
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" assets/rmtool-icon.png --out "$iconset/icon_${size}x${size}.png"
            retina=$((size * 2))
            sips -z "$retina" "$retina" assets/rmtool-icon.png --out "$iconset/icon_${size}x${size}@2x.png"
          done
          iconutil -c icns "$iconset" -o build/rmtool.icns
      - name: Build and package app
        run: |
          root=$PWD
          build/.venv/bin/python -m PyInstaller \
            --clean \
            --noconfirm \
            --windowed \
            --onedir \
            --name rmtool \
            --icon "$root/build/rmtool.icns" \
            --add-data "$root/assets/fonts:assets/fonts" \
            --add-data "$root/assets/device_frames:assets/device_frames" \
            --add-data "$root/translations/manifest.json:translations" \
            --add-data "$root/tap-page-turn/manifest.json:tap-page-turn" \
            --add-data "$root/fast-mono-reading/manifest.json:fast-mono-reading" \
            --distpath dist \
            --workpath build/macos \
            --specpath build \
            "$root/rmtool.py"
          test -d dist/rmtool.app
          ditto -c -k --sequesterRsrc --keepParent dist/rmtool.app dist/rmtool-macos-arm64.app.zip
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: rmtool-macos-arm64
          path: dist/rmtool-macos-arm64.app.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    needs:
      - build-windows
      - build-macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create draft GitHub release and verify assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes_file="docs/releases/${GITHUB_REF_NAME}.md"
          if [[ -f "$notes_file" ]]; then
            notes_args=(--notes-file "$notes_file")
          else
            notes_args=(--generate-notes)
          fi
          assets=(
            dist/rmtool-windows-x64.zip
            dist/rmtool-windows-x64-onefile.exe
            dist/rmtool-macos-arm64.app.zip
          )
          if existing_draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$existing_draft" != "true" ]]; then
              echo "Release $GITHUB_REF_NAME is already public; refusing to replace it." >&2
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "${assets[@]}" \
              --draft \
              --verify-tag \
              "${notes_args[@]}"
          fi

          verify_dir="$RUNNER_TEMP/github-release"
          mkdir -p "$verify_dir"
          gh release download "$GITHUB_REF_NAME" \
            --dir "$verify_dir" \
            --pattern "rmtool-windows-x64.zip" \
            --pattern "rmtool-windows-x64-onefile.exe" \
            --pattern "rmtool-macos-arm64.app.zip"
          for name in \
            rmtool-windows-x64.zip \
            rmtool-windows-x64-onefile.exe \
            rmtool-macos-arm64.app.zip; do
            cmp --silent "dist/$name" "$verify_dir/$name"
            echo "Verified GitHub release artifact: $name"
          done

      - name: Install Tencent COS SDK
        run: |
          python -m pip --isolated install \
            --disable-pip-version-check \
            --no-input \
            "cos-python-sdk-v5==1.9.44"

      - name: Publish application artifacts to Tencent COS
        env:
          COS_BUCKET: rmtool-localization-1254761827
          COS_REGION: ap-shanghai
          COS_PUBLIC_BASE_URL: https://rmtool-localization-1254761827.cos.ap-shanghai.myqcloud.com
          TENCENT_CLOUD_SECRET_ID: ${{ secrets.TENCENT_CLOUD_SECRET_ID }}
          TENCENT_CLOUD_SECRET_KEY: ${{ secrets.TENCENT_CLOUD_SECRET_KEY }}
        run: |
          python - <<'PY'
          import hashlib
          import mimetypes
          import os
          import time
          import urllib.parse
          import urllib.request
          from pathlib import Path

          from qcloud_cos import CosConfig, CosS3Client
          from qcloud_cos.cos_exception import CosClientError, CosServiceError

          secret_id = os.environ.get("TENCENT_CLOUD_SECRET_ID")
          secret_key = os.environ.get("TENCENT_CLOUD_SECRET_KEY")
          if not secret_id or not secret_key:
              raise SystemExit("Tencent Cloud GitHub Secrets are not configured.")

          names = (
              "rmtool-windows-x64.zip",
              "rmtool-windows-x64-onefile.exe",
              "rmtool-macos-arm64.app.zip",
          )
          artifacts = {name: Path("dist") / name for name in names}
          if any(path.stat().st_size <= 0 for path in artifacts.values()):
              raise SystemExit("A release artifact is empty.")

          def file_sha256(path):
              digest = hashlib.sha256()
              size = 0
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      size += len(chunk)
                      digest.update(chunk)
              return size, digest.hexdigest()

          expected_artifacts = {
              name: file_sha256(path) for name, path in artifacts.items()
          }

          client = CosS3Client(
              CosConfig(
                  Region=os.environ["COS_REGION"],
                  SecretId=secret_id,
                  SecretKey=secret_key,
                  Scheme="https",
                  Timeout=300,
              )
          )
          cache_buster = (
              f"{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
          )
          part_size_mb = 2
          max_threads = 3
          upload_state = {"multipart_available": True}

          def public_object_matches(key, expected_size, expected_digest):
              url = (
                  f"{os.environ['COS_PUBLIC_BASE_URL']}/"
                  f"{urllib.parse.quote(key, safe='/')}?precheck={cache_buster}"
              )
              try:
                  actual_digest = hashlib.sha256()
                  actual_size = 0
                  with urllib.request.urlopen(url, timeout=60) as response:
                      while chunk := response.read(1024 * 1024):
                          actual_size += len(chunk)
                          actual_digest.update(chunk)
                          if actual_size > expected_size:
                              break
              except Exception as exc:
                  print(f"COS precheck failed for {key}; uploading: {exc}")
                  return False
              if (
                  actual_size == expected_size
                  and actual_digest.hexdigest() == expected_digest
              ):
                  print(f"Skipped exact existing application artifact: {key}")
                  return True
              print(f"COS precheck mismatch for {key}; uploading.")
              return False

          def is_retryable_put_error(exc):
              if isinstance(exc, CosClientError):
                  return True
              return (
                  isinstance(exc, CosServiceError)
                  and (
                      exc.get_status_code() >= 500
                      or exc.get_error_code()
                      in {"InternalError", "RequestTimeout", "ServiceUnavailable", "SlowDown"}
                  )
              )

          def put_file_with_retries(path, key, content_type):
              for attempt in range(3):
                  try:
                      with path.open("rb") as body:
                          client.put_object(
                              Bucket=os.environ["COS_BUCKET"],
                              Key=key,
                              Body=body,
                              ContentType=content_type,
                          )
                      return
                  except (CosClientError, CosServiceError) as exc:
                      if not is_retryable_put_error(exc) or attempt == 2:
                          raise
                      time.sleep(2 ** attempt)

          def upload_file_compatible(path, key, content_type):
              if upload_state["multipart_available"]:
                  try:
                      client.upload_file(
                          Bucket=os.environ["COS_BUCKET"],
                          Key=key,
                          LocalFilePath=str(path),
                          PartSize=part_size_mb,
                          MAXThread=max_threads,
                          ContentType=content_type,
                      )
                      return
                  except CosServiceError as exc:
                      if exc.get_error_code() != "AccessDenied":
                          raise
                      upload_state["multipart_available"] = False
                      print("Multipart upload unavailable; using PutObject compatibility mode.")
              put_file_with_retries(path, key, content_type)

          def upload_prefix(prefix):
              for name, path in artifacts.items():
                  key = f"{prefix}/{name}"
                  expected_size, expected_digest = expected_artifacts[name]
                  if public_object_matches(key, expected_size, expected_digest):
                      continue
                  upload_file_compatible(
                      path,
                      key,
                      mimetypes.guess_type(name)[0] or "application/octet-stream",
                  )
                  print(f"Uploaded application artifact: {key}")

          def verify_prefix(prefix):
              for name, (expected_size, expected_digest) in expected_artifacts.items():
                  key = f"{prefix}/{name}"
                  url = (
                      f"{os.environ['COS_PUBLIC_BASE_URL']}/"
                      f"{urllib.parse.quote(key, safe='/')}?verify={cache_buster}"
                  )
                  last_error = None
                  for attempt in range(5):
                      try:
                          actual_digest = hashlib.sha256()
                          actual_size = 0
                          with urllib.request.urlopen(url, timeout=60) as response:
                              while chunk := response.read(1024 * 1024):
                                  actual_size += len(chunk)
                                  actual_digest.update(chunk)
                          if (
                              actual_size == expected_size
                              and actual_digest.hexdigest() == expected_digest
                          ):
                              print(f"Verified public application artifact: {key}")
                              break
                          last_error = RuntimeError("size or SHA-256 mismatch")
                      except Exception as exc:
                          last_error = exc
                      if attempt < 4:
                          time.sleep(2)
                  else:
                      raise SystemExit(
                          f"Public COS verification failed for {key}: {last_error}"
                      )

          versioned_prefix = f"releases/{os.environ['GITHUB_REF_NAME']}"
          upload_prefix(versioned_prefix)
          verify_prefix(versioned_prefix)
          upload_prefix("releases/latest")
          verify_prefix("releases/latest")
          PY

      - name: Publish verified GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
