name: Verify Feature Assets

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - tap-page-turn/manifest.json
      - fast-mono-reading/manifest.json
      - native-chinese/manifest.json
      - pinyin-input/manifest.json
      - reading-enhancements/manifest.json
      - tools/publish_resources.py
      - .github/workflows/sync-feature-assets.yml

permissions:
  contents: read

concurrency:
  group: feature-assets-verification
  cancel-in-progress: true

jobs:
  verify:
    name: Verify fixed feature releases
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download fixed feature releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for item in \
            "tap-page-turn:tap-page-turn-assets" \
            "fast-mono-reading:fast-mono-reading-assets" \
            "native-chinese:native-chinese-assets" \
            "pinyin-input:pinyin-input-assets" \
            "reading-enhancements:reading-enhancements-assets"
          do
            name="${item%%:*}"
            tag="${item#*:}"
            mkdir -p "$RUNNER_TEMP/releases/$name"
            gh release download "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --dir "$RUNNER_TEMP/releases/$name"
          done

      - name: Verify manifests and release payloads
        run: |
          python tools/publish_resources.py verify \
            --release-root "$RUNNER_TEMP/releases" \
            --resource tap-page-turn \
            --resource fast-mono-reading \
            --resource native-chinese \
            --resource pinyin-input \
            --resource reading-enhancements
