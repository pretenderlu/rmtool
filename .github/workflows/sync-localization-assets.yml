name: Verify Localization Assets

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - translations/manifest.json
      - tools/publish_resources.py
      - .github/workflows/sync-localization-assets.yml

permissions:
  contents: read

concurrency:
  group: localization-assets-verification
  cancel-in-progress: true

env:
  ASSET_RELEASE_TAG: localization-assets

jobs:
  verify:
    name: Verify fixed localization release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download fixed localization release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/releases/localization"
          gh release download "$ASSET_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP/releases/localization"

      - name: Verify release manifest and payloads
        run: |
          python tools/publish_resources.py verify \
            --release-root "$RUNNER_TEMP/releases" \
            --resource localization
